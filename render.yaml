# Render Blueprint for Homoeopathic Clinic Central Sync Engine
# Automatically detected when connecting this repository to Render (https://dashboard.render.com/)

services:
  - type: web
    name: homoeopathic-clinic-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

